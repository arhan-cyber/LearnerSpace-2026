<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Transaction | Finease</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Floating Navigation Pill -->
  <nav class="nav-pill">
    <a href="index.html" class="nav-logo">Finease</a>
    <div style="display: flex; gap: 15px; font-weight: 500; font-size: 14px;">
      <a href="dashboard.html" style="color: var(--color-static-black); text-decoration: none;">DASHBOARD</a>
      <a href="history.html" style="color: var(--color-static-black); text-decoration: none;">HISTORY</a>
      <a href="reports.html" style="color: var(--color-static-black); text-decoration: none;">REPORTS</a>
      <a href="assistant.html" style="color: var(--color-static-black); text-decoration: none;">ASSISTANT</a>
      <a href="settings.html" style="color: var(--color-static-black); text-decoration: none;">SETTINGS</a>
    </div>
    <a href="add-transaction.html" class="btn-get-app" style="background-color: var(--color-toxic-lime);">
      LOG CASH
    </a>
  </nav>

  <div class="app-container" style="max-width: 600px;">
    <header style="margin-bottom: var(--spacing-34); margin-top: 24px; text-align: center;">
      <h1 class="display-headline display-medium">LOG CASH</h1>
      <p style="font-weight: 500;">Add income or expense events. Keep the outlines clean.</p>
    </header>

    <div class="card-sticker white">
      <form id="transactionForm">
        <div class="form-group">
          <label for="type">Event Type</label>
          <select id="type" class="form-input" style="height: 50px;" required>
            <option value="expense">EXPENSE</option>
            <option value="income">INCOME</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <input type="text" id="description" class="form-input" placeholder="e.g. Tacos, Gig Payment" required>
        </div>

        <div class="form-group">
          <label for="amount">Amount (<span class="currency-symbol">₹</span>)</label>
          <input type="number" id="amount" class="form-input" min="0.01" step="0.01" placeholder="0.00" required>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" class="form-input" style="height: 50px;" required>
            <!-- Populated dynamically -->
          </select>
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" class="form-input" required>
        </div>

        <button type="submit" class="btn-toxic" style="width: 100%; justify-content: center; height: 50px; margin-top: 12px; font-size: 16px;">
          SAVE TRANSACTION
        </button>
      </form>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script>
    const categories = {
      expense: ["Food & Dining", "Rent & Bills", "Transportation", "Shopping", "Entertainment", "Healthcare", "Education", "Travel", "Other Expense"],
      income: ["Salary", "Freelance", "Investment", "Gifts", "Refunds", "Other Income"]
    };

    const typeSelect = document.getElementById("type");
    const categorySelect = document.getElementById("category");
    const dateInput = document.getElementById("date");
    const form = document.getElementById("transactionForm");
    const currencySymbols = document.querySelectorAll(".currency-symbol");

    function populateCategories() {
      const selectedType = typeSelect.value;
      categorySelect.innerHTML = "";
      categories[selectedType].forEach(category => {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category.toUpperCase();
        categorySelect.appendChild(option);
      });
    }

    typeSelect.addEventListener("change", populateCategories);

    // Initial setup
    dateInput.value = new Date().toISOString().split('T')[0];
    populateCategories();

    const settings = getSettings();
    currencySymbols.forEach(el => el.textContent = settings.currency || "₹");

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const transaction = {
        description: document.getElementById("description").value,
        amount: parseFloat(document.getElementById("amount").value),
        type: typeSelect.value,
        category: categorySelect.value,
        date: dateInput.value
      };

      addTransaction(transaction);
      alert("Added successfully!");
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
